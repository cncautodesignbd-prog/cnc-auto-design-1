<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Live Chat — CNC AUTO DESIGN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0b1220;
      color: #eef2ff;
    }
    
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
      flex-wrap: wrap;
    }
    
    .brand {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.35);
    }
    
    .brand b {
      letter-spacing: 0.3px;
      color: #eef2ff;
    }
    
    .back-btn {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      color: #3b0a0a;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
    }
    
    .back-btn:hover {
      filter: brightness(1.05);
    }
    
    .chat-container {
      display: flex;
      height: calc(100vh - 70px);
      background: #0b1220;
    }
    
    .sidebar {
      width: 300px;
      background: #0f172a;
      border-right: 1px solid #1e293b;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #1e293b;
      background: #1e293b;
    }
    
    .sidebar-header h3 {
      margin: 0;
      font-size: 16px;
      color: #eef2ff;
    }
    
    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    
    .user-item:hover {
      background: rgba(96, 165, 250, 0.1);
      border-color: #60a5fa;
    }
    
    .user-item.active {
      background: rgba(96, 165, 250, 0.2);
      border-color: #60a5fa;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      font-size: 16px;
    }
    
    .user-info {
      flex: 1;
    }
    
    .user-name {
      font-weight: 600;
      color: #eef2ff;
      margin: 0 0 4px;
      font-size: 14px;
    }
    
    .user-email {
      color: #94a3b8;
      font-size: 12px;
      margin: 0;
    }
    
    .user-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    
    .user-status.offline {
      background: #64748b;
    }
    
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b1220;
    }
    
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .chat-header .user-avatar {
      width: 36px;
      height: 36px;
      font-size: 14px;
    }
    
    .chat-header-info {
      flex: 1;
    }
    
    .chat-header-name {
      font-weight: 600;
      color: #eef2ff;
      margin: 0 0 4px;
      font-size: 14px;
    }
    
    .chat-header-email {
      color: #94a3b8;
      font-size: 12px;
      margin: 0;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      position: relative;
    }
    
    .message.user {
      align-self: flex-end;
      background: #1e293b;
      color: #eef2ff;
      border-bottom-right-radius: 4px;
    }
    
    .message.admin {
      align-self: flex-start;
      background: #1e40af;
      color: #eef2ff;
      border-bottom-left-radius: 4px;
    }
    
    .message-content {
      margin: 0;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .message-time {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }
    
    .chat-input-container {
      padding: 16px 20px;
      border-top: 1px solid #1e293b;
      background: #0f172a;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .chat-input {
      flex: 1;
      background: #0b1220;
      border: 1px solid #233144;
      border-radius: 8px;
      padding: 12px 16px;
      color: #eef2ff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input:focus {
      border-color: #60a5fa;
    }
    
    .send-btn {
      background: linear-gradient(180deg, #22c55e, #059669);
      color: #052016;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .send-btn:hover {
      filter: brightness(1.05);
    }
    
    .send-btn:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      text-align: center;
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .empty-state-text {
      font-size: 16px;
      margin: 0;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        width: 250px;
      }
      
      .chat-container {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        height: 200px;
        border-right: none;
        border-bottom: 1px solid #1e293b;
      }
      
      .user-list {
        display: flex;
        overflow-x: auto;
        padding: 8px;
        gap: 8px;
      }
      
      .user-item {
        min-width: 150px;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="cnc_auto_design.png" onerror="this.style.display='none'" alt="Logo"/>
      <b>ADMIN LIVE CHAT</b>
    </div>
    <button class="back-btn" onclick="goBack()">← Back to Admin Panel</button>
  </header>

  <div class="chat-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Active Users</h3>
      </div>
      <div class="user-list" id="userList">
        <!-- Users will be loaded here -->
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <p class="empty-state-text">Select a user to start chatting</p>
      </div>
    </div>
  </div>

  <script src="chat-server.js"></script>
  <script>
    let onlineChat;
    let selectedUser = null;

    function initializeChat() {
      // Enhanced chat system is already initialized by chat-server.js
      onlineChat = window.enhancedChat;
      console.log('Admin chat initialized with enhanced system');
      
      // Load users after a short delay to ensure server connection
      setTimeout(() => {
        loadUsers();
      }, 1000);
    }

    function loadUsers() {
      if (!onlineChat) {
        console.log('Chat system not ready yet');
        return;
      }
      
      console.log('Loading users from enhanced chat system...');
      onlineChat.loadAdminUsers();
    }

    function selectUser(user) {
      selectedUser = user;
      
      // Update active state
      document.querySelectorAll('.user-item').forEach(item => {
        item.classList.remove('active');
      });
      event.currentTarget.classList.add('active');
      
      // Load chat using enhanced system
      if (onlineChat) {
        onlineChat.selectAdminUser(user);
      }
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      
      if (message && selectedUser && onlineChat) {
        // Use enhanced chat system to send message
        onlineChat.sendAdminMessage();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function goBack() {
      window.close();
      // Or navigate back to admin panel
      // window.location.href = 'admin.html';
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      initializeChat();
    });
  </script>
</body>
</html>
